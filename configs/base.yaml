# ============================================================
# Thoracic X-ray Classification — Base Configuration
# ============================================================
# This is the LEGACY config. For new runs, use the per-run
# configs in configs/recipe_*.yaml which have all new keys.

# --- Experiment (Fix D/F) -----------------------------------
experiment:
  run_id: legacy
  seed: 42
  model_type: hybrid_resnet_mamba

# --- Dataset ------------------------------------------------
dataset:
  root_dir: "E:/PBL V/data/raw"
  csv_file: "Data_Entry_2017.csv"
  bbox_csv: "BBox_List_2017.csv"
  train_val_list: "train_val_list.txt"
  test_list: "test_list.txt"
  image_dirs:
    - "images_001/images"
    - "images_002/images"
    - "images_003/images"
    - "images_004/images"
    - "images_005/images"
    - "images_006/images"
    - "images_007/images"
    - "images_008/images"
    - "images_009/images"
    - "images_010/images"
    - "images_011/images"
    - "images_012/images"
  val_fraction: 0.1        # fraction of train_val patients used for val
  num_classes: 14
  use_cache: true
  class_names:
    - "Atelectasis"
    - "Cardiomegaly"
    - "Effusion"
    - "Infiltration"
    - "Mass"
    - "Nodule"
    - "Pneumonia"
    - "Pneumothorax"
    - "Consolidation"
    - "Edema"
    - "Emphysema"
    - "Fibrosis"
    - "Pleural_Thickening"
    - "Hernia"

# --- Data Policy (Fix A) -----------------------------------
data_policy:
  manifest_format: csv
  sampler: auto              # "uniform", "weighted_legacy", "auto"
  drop_last_train: true

# --- Image Enhancement (Fix G) -----------------------------
enhancement:
  image_size: 224
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  bilateral_d: 5
  bilateral_sigma_color: 50
  bilateral_sigma_space: 50
  sharpen_amount: 1.0
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std:  [0.229, 0.224, 0.225]
  # Fix G: independent booleans (legacy = all on)
  clahe_enabled: true
  bilateral_enabled: true
  unsharp_enabled: true

# --- Augmentation -------------------------------------------
augmentation:
  horizontal_flip_p: 0.5
  rotation_limit: 7
  brightness_limit: 0.1
  contrast_limit: 0.1
  shift_limit: 0.05
  scale_limit: 0.05
  # Fix G: conditional augmentation modules
  noise_enabled: true
  grid_distortion_enabled: true
  coarse_dropout_enabled: true

# --- Model (Fix C, D) --------------------------------------
model:
  backbone: "resnet50"
  resnet_out_channels: 2048
  mamba_d_model: 512
  mamba_d_state: 16
  mamba_num_blocks: 6
  mamba_bidirectional: true
  fusion_hidden: 768
  dropout: 0.4
  num_classes: 14
  # Fix C: residual fusion mode
  residual_fusion: "mean_v2"       # "legacy_sum" | "mean_v2"
  # Fix D: explicit backend
  mamba_backend: "custom_pytorch"  # "custom_pytorch" | "mamba_ssm"

# --- Training (Fix A, B, F) --------------------------------
training:
  loss: "asymmetric"         # "bce", "asymmetric", "focal", "weighted_bce"
  focal_gamma: 2.0
  asl_gamma_neg: 4.0
  asl_gamma_pos: 1.0
  asl_clip: 0.05
  label_smoothing: 0.1
  max_class_weight: 30.0
  # Fix A: separate weighting controls
  class_weighting: auto      # "none" | "auto"
  positive_weighting: none   # "none" | "sqrt_ratio"
  max_pos_weight: 5.0

  batch_size: 16
  accumulation_steps: 4      # effective batch = 16 × 4 = 64
  num_workers: 4
  epochs: 20
  mixed_precision: true

  # Fix B: frozen backbone config
  frozen_backbone_epochs: 5  # replaces stage1_epochs
  fine_tune_layers: ["layer4"]
  freeze_backbone_bn_stats: true
  min_finetune_epochs: 2

  # Legacy stage keys (kept for old callers)
  stage1_epochs: 5
  lr_backbone_stage1: 5.0e-5
  lr_head_stage1: 1.5e-4
  lr_backbone_stage2: 5.0e-6
  lr_head_stage2: 5.0e-5
  warmup_epochs_stage2: 3

  # Fix B: new explicit LR keys
  lr_backbone: 5.0e-6
  lr_head: 5.0e-5

  weight_decay: 5.0e-4
  early_stopping_patience: 5

  scheduler: "cosine_warm_restarts"
  cosine_T_0: 5
  cosine_T_mult: 2
  plateau_factor: 0.5
  plateau_patience: 3

# --- MC Dropout / Confidence --------------------------------
confidence:
  mc_passes: 20
  high_threshold: 0.05     # std < this → High confidence
  medium_threshold: 0.12   # std < this → Medium, else Low

# --- Grad-CAM++ ---------------------------------------------
gradcam:
  target_layer: "layer4"    # last conv block of ResNet50
  alpha_blend: 0.4
  heatmap_threshold_percentile: 80    # for localization mask

# --- Localization -------------------------------------------
localization:
  grid_rows: 3
  grid_cols: 2
  region_names:
    - "Right Upper"
    - "Left Upper"
    - "Right Mid"
    - "Left Mid"
    - "Right Lower"
    - "Left Lower"

# --- Paths --------------------------------------------------
paths:
  manifest_dir: "outputs"
  checkpoint_dir: "checkpoints"
  output_dir: "outputs"
  report_dir: "outputs/reports"
