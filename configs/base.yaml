# ============================================================
# Thoracic X-ray Classification — Base Configuration
# ============================================================

# --- Dataset ------------------------------------------------
dataset:
  root_dir: "E:/PBL V/data/raw"
  csv_file: "Data_Entry_2017.csv"
  bbox_csv: "BBox_List_2017.csv"
  train_val_list: "train_val_list.txt"
  test_list: "test_list.txt"
  image_dirs:
    - "images_001/images"
    - "images_002/images"
    - "images_003/images"
    - "images_004/images"
    - "images_005/images"
    - "images_006/images"
    - "images_007/images"
    - "images_008/images"
    - "images_009/images"
    - "images_010/images"
    - "images_011/images"
    - "images_012/images"
  val_fraction: 0.1        # fraction of train_val patients used for val
  num_classes: 14
  use_cache: true
  class_names:
    - "Atelectasis"
    - "Cardiomegaly"
    - "Effusion"
    - "Infiltration"
    - "Mass"
    - "Nodule"
    - "Pneumonia"
    - "Pneumothorax"
    - "Consolidation"
    - "Edema"
    - "Emphysema"
    - "Fibrosis"
    - "Pleural_Thickening"
    - "Hernia"

# --- Image Enhancement -------------------------------------
enhancement:
  image_size: 224
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  bilateral_d: 5
  bilateral_sigma_color: 50
  bilateral_sigma_space: 50
  sharpen_amount: 1.0
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std:  [0.229, 0.224, 0.225]

# --- Augmentation -------------------------------------------
augmentation:
  horizontal_flip_p: 0.5
  rotation_limit: 7
  brightness_limit: 0.1
  contrast_limit: 0.1
  shift_limit: 0.05
  scale_limit: 0.05

# --- Model --------------------------------------------------
model:
  backbone: "resnet50"
  resnet_out_channels: 2048
  mamba_d_model: 512
  mamba_d_state: 16
  mamba_num_blocks: 6
  mamba_bidirectional: true
  fusion_hidden: 768
  dropout: 0.4
  num_classes: 14

# --- Training -----------------------------------------------
training:
  loss: "asymmetric"         # "asymmetric", "focal", or "weighted_bce"
  focal_gamma: 2.0
  asl_gamma_neg: 4.0
  asl_gamma_pos: 1.0
  asl_clip: 0.05
  label_smoothing: 0.1
  max_class_weight: 30.0
  batch_size: 16
  accumulation_steps: 4      # effective batch = 16 × 4 = 64
  num_workers: 4
  epochs: 20
  early_stopping_patience: 5
  mixed_precision: true

  # Staged fine-tuning
  stage1_epochs: 5
  lr_backbone_stage1: 5.0e-5
  lr_head_stage1: 1.5e-4
  lr_backbone_stage2: 5.0e-6
  lr_head_stage2: 5.0e-5
  warmup_epochs_stage2: 3
  weight_decay: 5.0e-4

  scheduler: "cosine_warm_restarts"
  cosine_T_0: 5
  cosine_T_mult: 2
  plateau_factor: 0.5
  plateau_patience: 3

# --- MC Dropout / Confidence --------------------------------
confidence:
  mc_passes: 20
  high_threshold: 0.05     # std < this → High confidence
  medium_threshold: 0.12   # std < this → Medium, else Low

# --- Grad-CAM++ ---------------------------------------------
gradcam:
  target_layer: "layer4"    # last conv block of ResNet50
  alpha_blend: 0.4
  heatmap_threshold_percentile: 80    # for localization mask

# --- Localization -------------------------------------------
localization:
  grid_rows: 3
  grid_cols: 2
  region_names:
    - "Right Upper"
    - "Left Upper"
    - "Right Mid"
    - "Left Mid"
    - "Right Lower"
    - "Left Lower"

# --- Paths --------------------------------------------------
paths:
  manifest_dir: "outputs"
  checkpoint_dir: "checkpoints"
  output_dir: "outputs"
  report_dir: "outputs/reports"
